name: Validate Client

on:
  push:
    branches: ["main"]
    paths: &paths
      - "packages/client/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate-client.yml"
  pull_request:
    branches: ["main"]
    paths: *paths

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/client
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Uses the version from the root package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter spyfall-client...

      - name: Run Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Run Build
        run: pnpm run build
