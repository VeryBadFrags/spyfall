name: Validate Server

on:
  push:
    branches: ["main"]
    paths: &paths
      - "packages/server/**"
      - "packages/protocol/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate-server.yml"
  pull_request:
    branches: ["main"]
    paths: *paths

jobs:
  validate:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Uses the version from the root package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter spyfall-server...

      - name: Run Biome CI
        run: pnpm run ci

      - name: Run Type Check
        run: pnpm run typecheck
