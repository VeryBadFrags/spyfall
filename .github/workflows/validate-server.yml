name: Validate Server

on:
  push:
    branches: ["main"]
    paths: &paths
      - "packages/server/**"
      - "packages/types/**"
      - "package.json"
      - "biome.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate-server.yml"
  pull_request:
    branches: ["main"]
    paths: *paths

jobs:
  validate:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the version from the root package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter spyfall --filter spyfall-server...

      - name: Run Biome CI
        run: pnpm run ci

      - name: Run Type Check
        run: pnpm run typecheck
