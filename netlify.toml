# Paths below are relative to `base`
[build]
  base = "packages/client"
  command = "pnpm run build"
  publish = "dist"
  # Skip the build (and save credits) unless the client or the shared types changed.
  # Exit code 0 = no changes = cancel the build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../types"
